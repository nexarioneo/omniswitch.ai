name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate route types
        run: npm run typegen

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Prepare database
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Build
        run: npm run build
